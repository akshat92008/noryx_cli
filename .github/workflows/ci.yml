name: Deterministic CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -c release-constraints.txt -e '.[dev]'
      - name: Verify dependency contract
        run: |
          python -m pip check
          python - <<'PY'
          from nexus.qualification_environment import qualify_environment
          report = qualify_environment('.')
          assert report.passed, report.to_dict()
          PY
      - name: Compile and architecture gate
        run: |
          python -m compileall -q nexus tests scripts
          python -m nexus architecture check
      - name: Truth-integrity and installed CLI boundaries
        run: >-
          python -m pytest -q
          tests/test_truth_integrity_p0.py
          tests/test_offline_reliability_benchmark.py
          tests/test_e2e_installed_wheel.py
          tests/test_sandbox_stress.py
      - name: Full deterministic suite
        env:
          NEXUS_STATE_HMAC_KEY: ci-${{ matrix.os }}-${{ matrix.python }}
          NEXUS_DISABLE_NETWORK: "1"
          NEXUS_OFFLINE: "1"
        run: python -m pytest -q
