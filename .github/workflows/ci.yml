name: Deterministic CI

on:
  pull_request:
  push:
    branches: [main, "agent/**"]

permissions:
  contents: read

jobs:
  qualification:
    name: qualification and package build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned qualification environment
        run: python -m pip install -c release-constraints.txt -e '.[dev]'
      - name: Verify dependency contract
        run: |
          python -m pip check
          python -c "from nexus.qualification_environment import qualify_environment; report = qualify_environment('.'); assert report.passed, report.to_dict()"
      - name: Compile and architecture gate
        run: |
          python -m compileall -q nexus tests scripts
          python -m nexus architecture check
      - name: Lint launch-critical modules
        run: >-
          python -m ruff check
          nexus/locking.py
          nexus/path_grammar.py
          nexus/semantics.py
          nexus/qualification_environment.py
          nexus/intelligence/engineering/integrity.py
          scripts/ci_test_shard.py
          tests/test_locking.py
      - name: Truth-integrity and installed CLI boundaries
        env:
          NEXUS_STATE_HMAC_KEY: ci-qualification
          NEXUS_DISABLE_NETWORK: "1"
          NEXUS_OFFLINE: "1"
        run: >-
          python -m pytest -q -p no:randomly
          tests/test_truth_integrity_p0.py
          tests/test_offline_reliability_benchmark.py
          tests/test_e2e_installed_wheel.py
          tests/test_request_semantics_rc3.py
          tests/test_locking.py
      - name: Build distributable artifacts
        run: python -m build

  regression:
    name: regression shard ${{ matrix.shard }}/4
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            index: 0
          - shard: 2
            index: 1
          - shard: 3
            index: 2
          - shard: 4
            index: 3
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned qualification environment
        run: python -m pip install -c release-constraints.txt -e '.[dev]'
      - name: Run deterministic regression shard
        env:
          NEXUS_STATE_HMAC_KEY: ci-regression-${{ matrix.shard }}
          NEXUS_DISABLE_NETWORK: "1"
          NEXUS_OFFLINE: "1"
        run: python scripts/ci_test_shard.py --index ${{ matrix.index }} --count 4

  endurance:
    name: isolated stress and endurance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned qualification environment
        run: python -m pip install -c release-constraints.txt -e '.[dev]'
      - name: Run resource-intensive qualification tests
        env:
          NEXUS_STATE_HMAC_KEY: ci-endurance
          NEXUS_DISABLE_NETWORK: "1"
          NEXUS_OFFLINE: "1"
        run: >-
          python -m pytest -q -p no:randomly
          tests/security_adversarial/test_phase3_ledger_stress.py
          tests/security_adversarial/test_phase3_sandbox_stress.py
          tests/security_adversarial/test_phase7_repeated_sessions.py
          tests/security_adversarial/test_phase7_subprocess_endurance.py
          tests/security_adversarial/test_phase7_tool_endurance.py
          tests/test_sandbox_stress.py
          tests/test_stress_concurrent.py

  platform-smoke:
    name: smoke (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install pinned qualification environment
        run: python -m pip install -c release-constraints.txt -e '.[dev]'
      - name: Verify dependency contract
        run: |
          python -m pip check
          python -c "from nexus.qualification_environment import qualify_environment; report = qualify_environment('.'); assert report.passed, report.to_dict()"
      - name: Compile and architecture gate
        run: |
          python -m compileall -q nexus tests scripts
          python -m nexus architecture check
      - name: Cross-platform launch smoke
        env:
          NEXUS_STATE_HMAC_KEY: ci-${{ matrix.os }}-${{ matrix.python }}
          NEXUS_DISABLE_NETWORK: "1"
          NEXUS_OFFLINE: "1"
        run: >-
          python -m pytest -q -p no:randomly
          tests/test_truth_integrity_p0.py
          tests/test_e2e_installed_wheel.py
          tests/test_sandbox_stress.py
          tests/test_request_semantics_rc3.py
          tests/test_locking.py
          tests/test_mutation_scope_rc1.py
      - name: Build distributable artifacts
        run: python -m build
