name: Apply RC3 hardening patch

on:
  push:
    branches:
      - agent/rc3-semantic-release-hardening
    paths:
      - '.github/workflows/apply-rc3-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble and verify patch
        shell: bash
        run: |
          cat .rc3-patch/part-* > /tmp/noryx_rc3.patch
          echo 'e0afa8fe2b71a7723306977d08a7f549ccad27c7d264cc808b1bc6bbada1f463  /tmp/noryx_rc3.patch' | sha256sum -c -
          git apply --check /tmp/noryx_rc3.patch
      - name: Apply verified patch and clean carrier
        shell: bash
        run: |
          git apply /tmp/noryx_rc3.patch
          git rm -r .rc3-patch .github/workflows/apply-rc3-patch.yml
          git config user.name 'noryx-release-bot'
          git config user.email 'noryx-release-bot@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden rc3 semantics and release integrity'
          git push origin HEAD:agent/rc3-semantic-release-hardening
