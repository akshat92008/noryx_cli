name: Native sandbox qualification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'nexus/sandbox.py'
      - 'nexus/platform/sandbox_qualification.py'
      - 'scripts/qualify_native_sandbox.py'
      - '.github/workflows/native-sandbox-matrix.yml'
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e .
      - name: Install Linux native sandbox
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Qualify behavioral sandbox boundary
        run: python scripts/qualify_native_sandbox.py --workspace . --output sandbox-${{ runner.os }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-${{ runner.os }}
          path: sandbox-${{ runner.os }}.json
      - name: Require autonomous native qualification
        if: runner.os != 'Windows'
        run: python scripts/qualify_native_sandbox.py --workspace . --output sandbox-${{ runner.os }}-strict.json --require-autonomous
