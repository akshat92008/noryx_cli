[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noryx-cli"
dynamic = ["version"]
description = "Noryx CLI — a secure, verification-driven software-engineering runtime"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Akshat"}]
keywords = ["ai", "coding-agent", "cli", "verification", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "openai>=1.30.0,<3",
    "rich>=13.7.0,<16",
    "prompt_toolkit>=3.0.43,<4",
    "pygments>=2.17.0,<3",
    "starlette>=0.37.0,<1",
    "uvicorn[standard]>=0.29.0,<1",
    "websockets>=12.0,<17",
    "httpx[socks]>=0.27.0,<1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.2",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "pytest-randomly>=3.16,<5",
    "pytest-timeout>=2.4,<3",
    "cryptography>=43,<48",
    "ruff>=0.11,<1",
    "setuptools>=68",
    "wheel",
    "packaging>=24,<27",
]
browser = [
    "playwright>=1.50,<2",
]
intelligence = [
    "tree-sitter-language-pack>=0.9,<1",
]
qualification = [
    "cryptography>=43,<48",
    "packaging>=24,<27",
]

[project.scripts]
noryx = "nexus.cli:main"
# Backward-compatible command for existing 3.x installations.
nexus = "nexus.cli:main"

[project.urls]
Homepage = "https://github.com/akshat92008/noryx_cli"
Repository = "https://github.com/akshat92008/noryx_cli"
Issues = "https://github.com/akshat92008/noryx_cli/issues"

[tool.setuptools.packages.find]
include = ["noryx*", "nexus*"]

[tool.setuptools.dynamic]
version = {attr = "nexus.__version__"}

[tool.setuptools.package-data]
"nexus.webapp" = ["static/**/*"]
"nexus.resources.benchmarks" = ["*.json"]

[tool.setuptools.data-files]
# Ship benchmark manifests so pipx-installed users can run dry-run validation
# without a source checkout. These files are not Python packages.
"share/noryx-cli/benchmarks" = [
    "benchmarks/core.json",
    "benchmarks/competitive.example.json",
    "benchmarks/superiority.example.json",
    "benchmarks/trust-policy.example.json",
]
"share/noryx-cli" = [
    "benchmark-manifest.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live_model: test requires a live model backend (API key + network); skipped in offline CI",
]
filterwarnings = [
    # TrustStore is deprecated in 3.8.5; silence during the compatibility window while
    # external call-sites complete migration.  Remove when TrustStore is deleted in 3.9.
    "ignore::DeprecationWarning:nexus.trust",
]

[tool.coverage.run]
source = ["nexus", "noryx"]
omit = ["nexus/webapp/static/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["build", "dist", "verification_evidence"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# These modules intentionally re-export the public compatibility surface.
"nexus/cli/__init__.py" = ["F401"]
"nexus/tools/__init__.py" = ["F401"]
"nexus/intelligence/repository/__init__.py" = ["F401"]
# Bootstrap scripts insert the source root before importing the package.
"scripts/*.py" = ["E402"]
# The canonical tools implementation has a deliberate late import to avoid a
# circular dependency with its package facade and background supervisor.
"nexus/tools/tools_impl.py" = ["E402"]
